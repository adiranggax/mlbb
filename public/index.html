<!DOCTYPE html>
<html>
<head>
<title>MLBB ID Checker</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
padding:40px;
}

input{
padding:10px;
margin:5px;
border-radius:6px;
border:none;
}

button{
padding:10px 20px;
background:#2563eb;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}

#result{
margin-top:20px;
font-size:18px;
}

</style>

</head>

<body>

<h2>MLBB Nickname Checker</h2>

<input id="id" placeholder="User ID">
<input id="server" placeholder="Server ID">

<br><br>

<button onclick="cek()">Check</button>

<div id="result"></div>

<script>

async function cek(){

let id=document.getElementById("id").value
let server=document.getElementById("server").value

let res=await fetch(`/api/validasi?id=${id}&serverid=${server}`)
let data=await res.json()

if(data.status){

document.getElementById("result").innerHTML =
"Nickname : " + (data.nickname || data["in-game-nickname"])

}else{

document.getElementById("result").innerHTML =
"Error : " + data.message

}

}

</script>

</body>
</html>
